<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="{{bg}}" stop-opacity="1"/>
      <stop offset="100%" stop-color="{{bg}}" stop-opacity="0.88"/>
    </linearGradient>
    <radialGradient id="accentGlow" cx="{{glowCx}}%" cy="{{glowCy}}%" r="55%">
      <stop offset="0%" stop-color="{{accent}}" stop-opacity="{{glowOpacity}}"/>
      <stop offset="100%" stop-color="{{accent}}" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="{{accent}}" stop-opacity="0"/>
      <stop offset="50%" stop-color="{{accent}}" stop-opacity="1"/>
      <stop offset="100%" stop-color="{{accent}}" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="divider"><rect x="80" y="538" width="1040" height="5"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#accentGlow)"/>
  <rect x="0" y="0" width="12" height="630" fill="{{accent}}"/>
  <!-- Motion layers for the video loop: invisible at phase 0, so og.png is unchanged. -->
  <rect x="0" y="{{shimmerY}}" width="12" height="160" fill="url(#shimmer)" opacity="{{shimmerOpacity}}"/>

  <text x="80" y="148" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="1.5" fill="{{accent}}">{{label}}</text>

  <text x="80" y="260" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="{{fg}}">{{taglineLine1}}</text>
  <text x="80" y="350" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="{{fg}}">{{taglineLine2}}</text>

  <text x="80" y="430" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="{{muted}}">{{{subtitleTspans}}}</text>

  <line x1="80" y1="540" x2="1120" y2="540" stroke="{{muted}}" stroke-opacity="0.22" stroke-width="1"/>
  <rect x="{{sweepX}}" y="538" width="240" height="4" fill="url(#sweep)" opacity="{{sweepOpacity}}" clip-path="url(#divider)"/>

  <text x="80" y="578" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="{{fg}}">{{name}}</text>
  <text x="1120" y="578" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="{{muted}}" text-anchor="end">{{footer}}</text>
</svg>
